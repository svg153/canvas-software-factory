name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: npm test
        working-directory: com.github.copilot/extensions/software-factory
      - name: Desktop JS tests (config/paths/sidecar parser; no Rust, cargo NOT run)
        run: node --test desktop/test/
      - name: Check JavaScript syntax
        run: find com.github.copilot tools desktop -type f -name '*.mjs' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Validate manifests
        run: node --input-type=module -e "import fs from 'node:fs'; for (const path of ['plugin.json', 'com.github.copilot/extensions/software-factory/package.json', 'canvas-meta.json']) JSON.parse(fs.readFileSync(path, 'utf8'))"
      - name: Partial external layout/manifest check (official awesome-copilot gate not run)
        run: node tools/check-external-layout.mjs
      - name: Extension tree must not ship canvas.json
        run: test ! -e com.github.copilot/extensions/software-factory/canvas.json
      - name: Install-target canvas.json can be generated
        run: |
          mkdir -p "$RUNNER_TEMP/sf-ext"
          node tools/make-canvas-manifest.mjs . "$RUNNER_TEMP/sf-ext"
          node --input-type=module -e "import fs from 'node:fs'; const m = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/sf-ext/canvas.json', 'utf8')); if (m.id !== 'software-factory' || m.main !== 'extension.mjs') process.exit(1)"

  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run install/maintainability test suite (temp COPILOT_HOME only)
        shell: pwsh
        run: pwsh -NoProfile -File tests/install-tests.ps1
