name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (all .mjs)
        run: |
          find extensions/software-factory -name '*.mjs' -print0 |
            xargs -0 -n1 node --check
      - name: Runner tests
        run: node --test extensions/software-factory/runner/test/
