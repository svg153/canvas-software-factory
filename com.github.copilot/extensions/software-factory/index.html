<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="sf-action-token" content="__SF_ACTION_TOKEN__" />
<title>Software Factory</title>
<style>
  /* Tokens: variables del host con fallback; paleta completa por esquema de color.
     Colores semánticos con contraste >= 3:1 sobre el fondo de cada modo. */
  :root {
    color-scheme: light dark;
    --bg:   var(--background-color-default, #0d1117);
    --card: var(--background-color-raised, #161b22);
    --line: var(--border-color-default, #30363d);
    --txt:  var(--text-color-default, #e6edf3);
    --mut:  var(--text-color-muted, #8b949e);
    --acc:  #3fb950;  /* done / ok   */
    --warn: #d29922;  /* paused      */
    --bad:  #f85149;  /* failed      */
    --run:  #58a6ff;  /* running     */
    --font: var(--font-sans, "Segoe UI", system-ui, sans-serif);
    --mono: var(--font-mono, Consolas, "Cascadia Mono", ui-monospace, monospace);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:   var(--background-color-default, #f6f8fa);
      --card: var(--background-color-raised, #ffffff);
      --line: var(--border-color-default, #d0d7de);
      --txt:  var(--text-color-default, #1f2328);
      --mut:  var(--text-color-muted, #57606a);
      --acc:  #1a7f37;
      --warn: #9a6700;
      --bad:  #cf222e;
      --run:  #0969da;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--bg); color:var(--txt); font:14px/1.45 var(--font); padding:16px 18px;
  }
  header { display:flex; align-items:center; gap:12px 14px; margin-bottom:10px; flex-wrap:wrap; }
  .live { width:9px; height:9px; border-radius:50%; flex:none; background:var(--mut); }
  .live.running { background:var(--acc); animation:blink 1.6s infinite; }
  .live.paused { background:var(--warn); animation:blink 2.6s infinite; }
  .live.done { background:var(--acc); }
  @keyframes blink { 50% { opacity:.35; } }
  h1 { font-size:24px; font-weight:700; letter-spacing:-.01em; font-family:var(--font); }
  .round { color:var(--mut); font-size:13px; font-variant-numeric:tabular-nums; }
  .stat { color:var(--mut); font-size:12px; font-variant-numeric:tabular-nums; }
  .stat b { color:var(--txt); font-weight:600; }
  .btn {
    border:1px solid var(--line); background:var(--card); color:var(--txt);
    padding:7px 18px; border-radius:8px; cursor:pointer; font:600 13px var(--font);
    transition:border-color .15s, background .15s;
  }
  .btn:hover { border-color:var(--mut); }
  .btn.play { background:#1a4d2e; border-color:var(--acc); color:#7ee2a0; }
  .btn.pause { background:#4d2e1a; border-color:var(--warn); color:#e2c07e; }
  @media (prefers-color-scheme: light) {
    .btn.play { background:#dafbe1; color:#116329; }
    .btn.pause { background:#fff8c5; color:#7d4e00; }
  }
  .btn:disabled { opacity:.5; cursor:default; }
  .status {
    margin-left:auto; padding:3px 12px; border-radius:999px; border:1px solid var(--line);
    color:var(--mut); font-size:12px; white-space:nowrap;
  }
  .status.running { color:var(--run); border-color:var(--run); }
  .status.paused { color:var(--warn); border-color:var(--warn); }
  .status.done { color:var(--acc); border-color:var(--acc); }
  button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline:2px solid var(--run); outline-offset:1px; border-radius:6px;
  }
  #repopath { color:var(--mut); font-size:12px; margin:0 0 8px; overflow-wrap:anywhere; }
  .init { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .init input {
    background:var(--bg); border:1px solid var(--line); color:var(--txt);
    padding:6px 9px; border-radius:6px; font:13px var(--font);
  }
  .init input::placeholder { color:var(--mut); }
  #repobar { margin:0 0 12px; }
  .pipeline { display:flex; gap:10px; margin:14px 0 16px; flex-wrap:wrap; }
  .phase {
    flex:1 1 120px; background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; min-width:0; position:relative;
  }
  /* conector de secuencia entre fases */
  .phase:not(:last-child)::after {
    content:"›"; position:absolute; right:-9px; top:50%; transform:translateY(-50%);
    color:var(--mut); font-size:14px; line-height:1;
  }
  .phase.active { border-color:var(--run); background:color-mix(in srgb, var(--run) 9%, var(--card)); }
  .phase.donep { border-color:var(--acc); background:color-mix(in srgb, var(--acc) 7%, var(--card)); }
  .phase b { display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .phase span { color:var(--mut); font-size:11px; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:14px; }
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .panel h2 { font-size:11px; margin-bottom:8px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .task {
    display:flex; gap:8px; padding:7px 8px; border-radius:8px; align-items:baseline;
    border:1px solid transparent; transition:border-color .15s, background .15s;
  }
  .task:hover { border-color:var(--line); background:color-mix(in srgb, var(--run) 5%, transparent); }
  .task + .task { margin-top:2px; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; align-self:center; }
  .dot.pending { background:var(--mut); }
  .dot.awaiting_agent { background:var(--run); animation:blink 1.1s infinite; }
  .dot.done { background:var(--acc); border-radius:3px; }
  .dot.failed { background:var(--bad); border-radius:2px; transform:rotate(45deg); }
  .task .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task .id { color:var(--mut); font-size:11px; font-family:var(--mono); flex:none; }
  a { color:var(--run); text-decoration:none; } a:hover { text-decoration:underline; }
  .issue { padding:6px 8px; border-bottom:1px dashed color-mix(in srgb, var(--line) 55%, transparent); }
  .issue:last-child { border-bottom:0; }
  .issue a, .issue span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--mut); font-style:italic; padding:10px 8px; text-align:center; }
  #log {
    font:12px/1.5 var(--mono); max-height:180px; overflow:auto; margin-top:14px;
    border:1px solid var(--line); border-radius:10px; padding:6px 10px; background:var(--bg);
  }
  #log .line {
    display:flex; gap:9px; padding:2px 0;
    border-bottom:1px dashed color-mix(in srgb, var(--line) 45%, transparent);
  }
  #log .line:last-child { border-bottom:0; }
  #log .ts { color:var(--mut); flex:none; font-variant-numeric:tabular-nums; }
  #log .msg { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--mut); }
  #log .line.ok .msg { color:var(--txt); }
  #log .line.err .msg { color:var(--bad); }
  #log .line.err { background:color-mix(in srgb, var(--bad) 7%, transparent); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<header>
  <span class="live" id="live" aria-hidden="true"></span>
  <h1>🏭 Software Factory</h1>
  <span class="round" id="round"></span>
  <span class="stat"><b id="sWorking">0</b> activas</span>
  <span class="stat"><b id="sDone">0</b> done</span>
  <span class="stat"><b id="sFailed">0</b> failed</span>
  <button class="btn play" id="play" aria-label="Iniciar o reanudar la fábrica">▶ Play</button>
  <button class="btn pause" id="pause" aria-label="Pausar la fábrica">⏸ Pausa</button>
  <span class="status" id="status" role="status" aria-live="polite">sin estado</span>
</header>
<div class="round" id="repopath" title="Directorio que gestiona este panel"></div>
<div class="init" id="repobar">
  <input id="repoInput" placeholder="ruta del workspace (C:\...\mi-repo)" size="42" aria-label="Ruta absoluta del workspace git" title="Ruta absoluta del repositorio git que quiere gestionar este panel. El host de extensiones no conoce tu sesión: escribe la ruta aquí y pulsa «Usar repo»." />
  <button class="btn" id="setRepo" title="Aplicar la ruta escrita">Usar repo</button>
</div>

<div class="pipeline" id="pipeline" aria-label="Fases de la fábrica"></div>

<div class="grid">
  <div class="panel" role="region" aria-label="Tareas de la fase actual">
    <h2>Tareas de la fase actual</h2>
    <div id="tasks"><div class="empty">Sin fábrica iniciada.</div></div>
  </div>
  <div class="panel" role="region" aria-label="Issues creadas y configuración">
    <h2>Issues creadas</h2>
    <div id="issues"><div class="empty">Ninguna todavía.</div></div>
    <h2 style="margin-top:14px">Configurar</h2>
    <div class="init">
      <input id="ghrepo" placeholder="owner/repo" size="18" aria-label="Repositorio en GitHub" title="Repositorio en GitHub, formato owner/name (ej. svg153/canvas-software-factory)" />
      <input id="project" placeholder="Project nº (opc.)" size="14" aria-label="Número de GitHub Project" title="NÚMERO del GitHub Project (no su nombre). Vacío = sin Project." />
      <input id="projectOwner" placeholder="Project owner (opc.)" size="18" aria-label="Owner del GitHub Project" title="Usuario u organización dueña del Project. Por defecto: el owner del repo." />
      <input id="rounds" placeholder="rounds" size="6" value="3" aria-label="Número de rounds" title="Número de rounds del bucle" />
      <button class="btn" id="initBtn">Init</button>
    </div>
  </div>
</div>

<div id="log" role="log" aria-label="Registro de actividad" aria-live="polite"></div>

<script type="module" src="/app.mjs"></script>
</body>
</html>
