<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="sf-action-token" content="__SF_ACTION_TOKEN__" />
<title>Software Factory</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --card:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e;
          --acc:#3fb950; --warn:#d29922; --run:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.45 "Segoe UI",system-ui,sans-serif; padding:18px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  h1 { font-size:26px; font-family:Consolas,"Cascadia Mono",monospace; letter-spacing:-.02em; }
  .round { color:var(--mut); font-size:13px; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--txt); padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:600; }
  .btn.play { background:#1a4d2e; border-color:var(--acc); color:#7ee2a0; }
  .btn.pause { background:#4d2e1a; border-color:var(--warn); color:#e2c07e; }
  .btn:disabled { opacity:.5; cursor:default; }
  .status { margin-left:auto; padding:4px 12px; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
  .status.running { color:var(--run); border-color:var(--run); }
  .status.paused { color:var(--warn); border-color:var(--warn); }
  .status.done { color:var(--acc); border-color:var(--acc); }
  .pipeline { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .phase { flex:1 1 120px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; position:relative; }
  .phase.active { border-color:var(--run); box-shadow:0 0 0 1px var(--run); }
  .phase.donep { border-color:var(--acc); opacity:.85; }
  .phase b { display:block; font-size:13px; } .phase span { color:var(--mut); font-size:12px; }
  .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { font-size:14px; margin-bottom:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  .task { display:flex; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); align-items:baseline; }
  .task:last-child { border-bottom:0; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.pending{background:var(--mut);} .dot.awaiting_agent{background:var(--run);} .dot.done{background:var(--acc);} .dot.failed{background:#f85149;}
  .task .t { flex:1; } .task .id { color:var(--mut); font-size:11px; }
  a { color:var(--run); text-decoration:none; } a:hover { text-decoration:underline; }
  .issue { padding:6px 0; border-bottom:1px dashed var(--line); }
  .empty { color:var(--mut); font-style:italic; padding:8px 0; }
  #log { font-family:Consolas,monospace; font-size:12px; color:var(--mut); max-height:120px; overflow:auto; margin-top:16px; white-space:pre-wrap; }
  .init { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .init input { background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:6px 8px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>🏭 Software Factory</h1>
  <span class="round" id="round">—</span>
  <button class="btn play" id="play">▶ Play</button>
  <button class="btn pause" id="pause">⏸ Pausa</button>
  <span class="status" id="status">sin estado</span>
</header>

<div class="pipeline" id="pipeline"></div>

<div class="grid">
  <div class="panel">
    <h2>Tareas de la fase actual</h2>
    <div id="tasks"><div class="empty">Sin fábrica iniciada.</div></div>
  </div>
  <div class="panel">
    <h2>Issues creadas</h2>
    <div id="issues"><div class="empty">Ninguna todavía.</div></div>
    <h2 style="margin-top:14px">Configurar</h2>
    <div class="init">
      <input id="ghrepo" placeholder="owner/repo" size="18" />
      <input id="project" placeholder="Project id (opcional)" size="18" />
      <input id="projectOwner" placeholder="Project owner (opcional)" size="18" />
      <input id="rounds" placeholder="rounds" size="6" value="3" />
      <button class="btn" id="initBtn">Init</button>
    </div>
  </div>
</div>

<div class="panel" style="margin-top:16px">
  <h2>💡 Idea del usuario (vocal idea)</h2>
  <div class="init">
    <input id="ideaText" placeholder="Describe tu idea: la próxima fase plan la convertirá en 1 o más issues que siguen el mismo flujo (grill → issues → Project → implement → review)" size="60" />
    <button class="btn" id="ideaBtn">Añadir idea</button>
  </div>
  <div id="seeds" style="margin-top:10px"><div class="empty">Ninguna idea todavía.</div></div>
</div>

<pre id="log"></pre>

<script type="module" src="/app.mjs"></script>
</body>
</html>
